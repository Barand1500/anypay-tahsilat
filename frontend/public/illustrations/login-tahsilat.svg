<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="cardFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#d7e8f8"/>
    </linearGradient>
    <linearGradient id="cardStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b3058"/>
      <stop offset="100%" stop-color="#1a5a96"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2744"/>
      <stop offset="100%" stop-color="#163a66"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#041526" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- soft blobs (opaque, theme-matched) -->
  <circle cx="560" cy="90" r="120" fill="#1e5f9a" fill-opacity="0.35"/>
  <circle cx="120" cy="340" r="100" fill="#0d3a66" fill-opacity="0.45"/>
  <circle cx="380" cy="60" r="48" fill="#7eb6e8" fill-opacity="0.22"/>

  <!-- credit card -->
  <g transform="translate(70 90) rotate(-10)" filter="url(#soft)">
    <rect width="360" height="220" rx="26" fill="url(#cardFace)"/>
    <rect y="42" width="360" height="46" fill="url(#cardStripe)"/>
    <rect x="28" y="118" width="54" height="40" rx="8" fill="#f0c14a"/>
    <rect x="28" y="118" width="54" height="40" rx="8" fill="#e8b03a" fill-opacity="0.35"/>
    <rect x="28" y="176" width="170" height="12" rx="6" fill="#0f3057" fill-opacity="0.28"/>
    <rect x="28" y="196" width="110" height="10" rx="5" fill="#0f3057" fill-opacity="0.18"/>
    <rect x="250" y="176" width="80" height="12" rx="6" fill="#0f3057" fill-opacity="0.2"/>
    <!-- contactless -->
    <g stroke="#1a5a96" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.75">
      <path d="M310 118c14 8 22 20 24 34"/>
      <path d="M322 108c20 10 32 28 36 48" opacity="0.55"/>
    </g>
  </g>

  <!-- phone -->
  <g transform="translate(430 70)" filter="url(#soft)">
    <rect width="168" height="300" rx="28" fill="url(#phoneBody)"/>
    <rect x="10" y="12" width="148" height="276" rx="20" fill="#e8f2fc"/>
    <circle cx="84" cy="36" r="5" fill="#94a3b8"/>
    <circle cx="84" cy="150" r="42" fill="#22c55e"/>
    <path d="M66 150l12 12 24-26" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="44" y="220" width="80" height="10" rx="5" fill="#94a3b8" fill-opacity="0.55"/>
    <rect x="54" y="240" width="60" height="8" rx="4" fill="#94a3b8" fill-opacity="0.35"/>
  </g>

  <!-- coins -->
  <g filter="url(#soft)">
    <circle cx="160" cy="330" r="28" fill="#f5c542"/>
    <circle cx="160" cy="330" r="20" fill="#ffe08a" fill-opacity="0.55"/>
    <circle cx="210" cy="350" r="22" fill="#e8b03a"/>
    <circle cx="210" cy="350" r="15" fill="#ffe08a" fill-opacity="0.45"/>
  </g>
</svg>
